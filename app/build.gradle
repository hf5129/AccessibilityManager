plugins {
    id 'com.android.application'
}

android {
    compileSdk 36

    defaultConfig {
        applicationId "com.accessibilitymanager"
        minSdk 26
        targetSdk 36
        versionCode 103
        versionName "10.3"

        // 别再试 multiDexKeepProguard（2026-10-09 实测无效，勿重犯）：
        // 想把自己代码钉进主 dex，配了 multiDexKeepProguard file('main-dex-rules.pro')
        // （-keep class com.accessibilitymanager.** { *; }），并加 multiDexEnabled true，
        // 构建后反查 dex 布局**毫无变化** —— 原因：minSdk 26 用的是 native multidex，
        // main dex list 那套机制只在 legacy multidex（minSdk < 21）才被 D8 采用。
        // 实测结论：release 路径（releaseTest）本来就把本应用类放在 classes.dex；
        // debug 路径把入口类排在 classes3.dex（debug 比 release 多约 2MB 类、共 4 个 dex），
        // 而这个差异目前没有受支持的杠杆去调。真要根治得走 R8（方法数压到单 dex）。

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // 出 release 时用环境变量注入签名材料（四个 SIGNING_*）：
        //   set "SIGNING_STORE_FILE=%USERPROFILE%\.android\debug.keystore"
        //   …
        //   gradlew.bat assembleRelease --no-daemon
        // ⚠️ 一定要带 --no-daemon（或先 gradlew --stop）：Gradle daemon 是长驻进程，
        //    不会继承你新设的环境变量，复用旧 daemon 会读不到 SIGNING_STORE_FILE。
        release {
            // 只从环境变量读签名材料；不再回落到并不存在的 empty.jks。
            // 注意：这四个 setter 都不接受 null（AGP 会直接抛 "Value is null"），
            // 所以必须整块包在判空里；缺材料时 storeFile 保持未设置，
            // 由文件末尾的 taskGraph 检查给出明确提示。
            def storePath = System.getenv("SIGNING_STORE_FILE")
            if (storePath != null && !storePath.isEmpty()) {
                storeFile file(storePath)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // R8：方法数压到单 dex、去掉未用代码与资源（配合 res/raw/keep.xml 保住主题引用的弹窗布局）
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // 2026-10-08 新增，用于排查「弹窗按钮首次按下卡一下」是不是 ART 纯 JIT 造成的：
        // 与 release 完全一致（不混淆、不 shrink、debuggable=false），只是改用 debug 签名，
        // 这样可以和现有 debug 包互相覆盖安装（同一个 keystore，不会签名冲突）。
        // 与 debug 包的唯一实质差别：debuggable=false ⇒ 安装时 dex2oat 会做 AOT/quickening，
        // 而不是像 debug 那样只校验、所有代码靠运行时 JIT。
        // 用法：gradlew :app:assembleReleaseTest  →  app/build/outputs/apk/releaseTest/
        releaseTest {
            initWith release
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        // 1.8 → 17：JDK 21 上不再有过时的"源值 8"警告，语言特性也与 AGP 8 现代默认一致。
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // 让 release 也跑 lint（lintVitalRelease），并且遇到 error 就让构建失败。
        // 历史的既有问题记录在 lint-baseline.xml 里（只挡**新增**的 error）；
        // 老问题逐个修掉后可删掉 baseline 再跑一次。
        checkReleaseBuilds true
        abortOnError true
        baseline file("lint-baseline.xml")
    }

    namespace 'com.accessibilitymanager'
}

// 缺签名材料时给一句人话，而不是 AGP 那句
//   SigningConfig "release" is missing required property "storeFile".
// 注意：不能挂在 validateSigningRelease 上 —— 该任务只在签名配置**有** storeFile 时才被创建，
// 缺材料时它根本不存在（本工程实测：任务列表里只有 validateSigningDebug / validateSigningReleaseTest）。
// 所以在任务图就绪时检查，既不误伤 assembleDebug，又能尽早失败。
gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(':app:packageRelease') && android.signingConfigs.release.storeFile == null) {
        throw new GradleException(
            "缺少发布签名材料：请设置 SIGNING_STORE_FILE / SIGNING_STORE_PASSWORD / " +
            "SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD 四个环境变量；" +
            "只想本机装机验证请改用 :app:assembleReleaseTest（debug 签名）。")
    }
}

dependencies {
    implementation "dev.rikka.shizuku:api:13.1.0"
    implementation "dev.rikka.shizuku:provider:13.1.0"
    // 为了支持 minSdk 18，必须将 material >= 1.9.0
    // 升级到 1.14.0：使用官方 M3 Expressive Lists 组件（ListItemCardView / ListItemLayout / segmented 样式）
    implementation 'com.google.android.material:material:1.14.0'
    // （原来这里有一条显式依赖 androidx.dynamicanimation:dynamicanimation:1.1.0，
    //   是给锁按钮那版手写弹簧动画用的；弹簧代码已于 2026-10-02 整段移除，
    //   而 material 1.14.0 的 POM 本身就传递依赖同一个 1.1.0，故这条删除不影响解析结果与包内容。
    //   需要恢复弹簧版时再加回来，存档见 memory/2026-10-02/lock-anim/。）
    // 显式覆盖 material 1.14.0 传递进来的 appcompat 1.7.0 / annotation 1.8.1
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.annotation:annotation:1.10.0'
    // 列表增删/移动动画用的是 RecyclerView 自带的 item 动画（material 1.14 的 POM 本就依赖
    // androidx.recyclerview:recyclerview:1.4.0（原为 material 传递进来的 1.2.1，2026-10-15 升到当前稳定版）；用到的依赖还是显式声明）
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    testImplementation 'junit:junit:4.13.2'
}
